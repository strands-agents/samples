[project]
name = "fastapi-strands-production-starter"
version = "0.1.0"
description = "A production-minded FastAPI service built on Strands Agents: lifecycle controls, a SQLite session store, an MCP server, OpenTelemetry export, and a Strands Evals regression suite."
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.44.0",
    "strands-agents-tools>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.9.0,<2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# OpenAI model provider (optional; Bedrock works out of the box)
openai = ["strands-agents[openai]>=1.44.0"]
# Evaluation suite
evals = ["strands-agents-evals>=1.0.0"]

[tool.uv]
dev-dependencies = [
    "strands-agents-evals>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "mcp_server", "evals"]

[tool.ruff]
line-length = 100
target-version = "py310"
