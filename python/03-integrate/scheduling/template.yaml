AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Cognito + EventBridge Scheduler -> EventBridge Bus -> API Destination -> AgentCore Runtime.
  Invokes an AgentCore agent on a recurring schedule.

Parameters:
  AgentCoreEndpoint:
    Type: String
    Description: AgentCore Runtime invocation URL
  AgentName:
    Type: String
    Default: scheduled_agentcore_agent
  ScheduleExpression:
    Type: String
    Default: 'rate(1 hour)'
    Description: 'Schedule expression (e.g. rate(1 hour), cron(0 9 * * ? *))'
  SchedulePayload:
    Type: String
    Default: '{"prompt":"You are triggered by a schedule. Report the current time and confirm you are running."}'
    Description: JSON payload sent to the agent on each invocation

Resources:
  # ── Cognito ──────────────────────────────────────────────────
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-pool'

  CognitoDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'
      UserPoolId: !Ref CognitoUserPool

  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: !Ref AgentName
      Name: !Sub '${AgentName}-api'
      UserPoolId: !Ref CognitoUserPool
      Scopes:
        - ScopeName: invoke
          ScopeDescription: Invoke the AgentCore agent

  CognitoAppClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoResourceServer
    Properties:
      ClientName: !Sub '${AWS::StackName}-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - !Sub '${AgentName}/invoke'
      SupportedIdentityProviders:
        - COGNITO

  # ── EventBridge Bus ──────────────────────────────────────────
  AgentEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${AWS::StackName}-bus'

  # ── DLQ ──────────────────────────────────────────────────────
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-dlq'
      MessageRetentionPeriod: 1209600

  # ── EventBridge Connection (OAuth via Cognito) ───────────────
  AgentCoreConnection:
    Type: AWS::Events::Connection
    Properties:
      Name: !Sub '${AWS::StackName}-connection'
      AuthorizationType: OAUTH_CLIENT_CREDENTIALS
      AuthParameters:
        OAuthParameters:
          AuthorizationEndpoint: !Sub
            - 'https://${Domain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
            - Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'
          HttpMethod: POST
          ClientParameters:
            ClientID: !Ref CognitoAppClient
            ClientSecret: !GetAtt CognitoAppClientSecret.ClientSecret
          OAuthHttpParameters:
            BodyParameters:
              - Key: grant_type
                Value: client_credentials
                IsValueSecret: false
              - Key: scope
                Value: !Sub '${AgentName}/invoke'
                IsValueSecret: false

  # ── Lambda to retrieve Cognito client secret ─────────────────
  CognitoAppClientSecret:
    Type: Custom::CognitoClientSecret
    Properties:
      ServiceToken: !GetAtt GetClientSecretFunction.Arn
      UserPoolId: !Ref CognitoUserPool
      ClientId: !Ref CognitoAppClient

  GetClientSecretFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: cognito-idp:DescribeUserPoolClient
              Resource: !GetAtt CognitoUserPool.Arn
      InlineCode: |
        import boto3
        import cfnresponse
        def handler(event, context):
            try:
                if event['RequestType'] == 'Delete':
                    cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                    return
                client = boto3.client('cognito-idp')
                resp = client.describe_user_pool_client(
                    UserPoolId=event['ResourceProperties']['UserPoolId'],
                    ClientId=event['ResourceProperties']['ClientId']
                )
                cfnresponse.send(event, context, cfnresponse.SUCCESS,
                    {'ClientSecret': resp['UserPoolClient']['ClientSecret']})
            except Exception as e:
                cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  # ── API Destination ──────────────────────────────────────────
  AgentCoreApiDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      Name: !Sub '${AWS::StackName}-dest'
      ConnectionArn: !GetAtt AgentCoreConnection.Arn
      InvocationEndpoint: !Ref AgentCoreEndpoint
      HttpMethod: POST
      InvocationRateLimitPerSecond: 10

  # ── IAM Role: EventBridge Rule -> API Destination ────────────
  EventBridgeApiDestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-EBApiDestRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeApiDest
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource: !GetAtt AgentCoreApiDestination.Arn

  # ── EventBridge Rule (Bus -> API Destination) ────────────────
  AgentInvocationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-rule'
      EventBusName: !Ref AgentEventBus
      State: ENABLED
      EventPattern:
        source:
          - scheduler.agentcore
        detail-type:
          - ScheduledAgentInvocation
      Targets:
        - Id: AgentCoreTarget
          Arn: !GetAtt AgentCoreApiDestination.Arn
          RoleArn: !GetAtt EventBridgeApiDestRole.Arn
          InputTransformer:
            InputPathsMap:
              prompt: $.detail.prompt
            InputTemplate: '{"prompt": <prompt>}'
          DeadLetterConfig:
            Arn: !GetAtt DeadLetterQueue.Arn

  # ── DLQ Policy (allow EventBridge to send to DLQ) ────────────
  DeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt DeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt AgentInvocationRule.Arn

  # ── IAM Role: Scheduler -> PutEvents ─────────────────────────
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-SchedulerRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SchedulerPutEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt AgentEventBus.Arn

  # ── EventBridge Scheduler ────────────────────────────────────
  AgentSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${AWS::StackName}-schedule'
      ScheduleExpression: !Ref ScheduleExpression
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt AgentEventBus.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        EventBridgeParameters:
          Source: scheduler.agentcore
          DetailType: ScheduledAgentInvocation
        Input: !Ref SchedulePayload

Outputs:
  EventBusName:
    Value: !Ref AgentEventBus
  EventBusArn:
    Value: !GetAtt AgentEventBus.Arn
  ConnectionName:
    Value: !Sub '${AWS::StackName}-connection'
  ApiDestinationName:
    Value: !Sub '${AWS::StackName}-dest'
  ScheduleName:
    Value: !Sub '${AWS::StackName}-schedule'
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoAppClientId:
    Value: !Ref CognitoAppClient
  CognitoDomain:
    Value: !Sub '${AWS::StackName}-${AWS::AccountId}'
  CognitoTokenEndpoint:
    Value: !Sub
      - 'https://${Domain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
      - Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'
  CognitoOIDCDiscovery:
    Description: Use as Discovery URL for AgentCore JWT authorizer
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}/.well-known/openid-configuration'
  AgentCoreEndpoint:
    Value: !Ref AgentCoreEndpoint
  AgentName:
    Value: !Ref AgentName
  ScheduleExpression:
    Value: !Ref ScheduleExpression
  DLQUrl:
    Value: !Ref DeadLetterQueue
