name: Samples manifest

on:
  pull_request:
    paths:
      - 'python/**'
      - 'typescript/**'
      - 'README.md'
      - 'generate-samples-manifest.mjs'
      - 'samples.json'
      - '.github/workflows/samples-manifest.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify samples manifest
        run: node generate-samples-manifest.mjs --check
