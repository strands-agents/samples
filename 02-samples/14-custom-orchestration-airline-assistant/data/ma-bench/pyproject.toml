[project]
name = "mabench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autogen>=0.8.3",
    "autogen-agentchat>=0.4.9.2",
    "autogen-ext>=0.4.9.2",
    "deepdiff>=8.4.2",
    "google-genai>=1.11.0",
    "langchain>=0.3.21",
    "langchain-anthropic>=0.3.10",
    "langchain-google-genai>=2.1.3",
    "langchain-google-vertexai>=2.0.20",
    "langchain-openai>=0.3.9",
    "langgraph>=0.3.18",
    "langgraph-api>=0.0.38",
    "langgraph-cli>=0.1.80",
    "langgraph-prebuilt>=0.1.4",
    "langgraph-swarm>=0.0.7",
    "pandas>=2.2.3",
    "starlette>=0.46.1",
]


[tool.setuptools]
packages = ["mabench"]
[tool.setuptools.package-dir]
"mabench" = "mabench"

[dependency-groups]
dev = [
    "plotly>=6.0.1",
]

